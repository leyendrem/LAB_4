[project]
name = "eeg-epilepsy"
version = "0.1.0"
description = "Auditoría reproducible y análisis EEG CHB-MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9,<4",
    "mne>=1.13.2",
    "numpy>=2,<3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scipy>=1.14,<2",
    "streamlit>=1.65.0",
]

[project.scripts]


[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]
